<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieKnight - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="assets/images/movie-knight-logo-sidebar.svg" alt="MovieKnight" class="nav-logo">
            </div>
            
            <nav class="main-nav">
                
                <a href="index.html" class="nav-link active">
                    <img src="assets/images/home-icon.svg" alt="Home Icon" class="nav-logo">
                    Home
                </a>
                
                <a href="#" class="nav-link">
                    <img src="assets/images/explore-icon.svg" alt="Explore Icon" class="nav-logo">
                    Explore
                </a>
                <a href="#" class="nav-link">
                    <img src="assets/images/profile-icon.svg" alt="Profile Icon" class="nav-logo">
                    Profile
                </a>
                <a href="#" class="nav-link about-link">
                    <img src="assets/images/about-icon.svg" alt="Home Icon" class="nav-logo">
                    <span>About</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left-group">
                    <div class="search-container">
                        <img src="assets/images/search-icon.svg" alt="Search Icon" class="nav-search-icon">
                        <input type="text" id="movieSearch" placeholder="Search movies...">
                        <button class="ai-mode-btn">
                            <img src="assets/images/ai-icon.svg" alt="Search Icon" class="nav-search-icon">
                            AI mode
                        </button>
                    </div>
                
                    <div class="surprise-container">
                        <button class="surprise-btn">
                            <img src="assets/images/dice-icon.svg" alt="Search Icon" class="nav-search-icon">
                        </button>
                        <p>SURPRISE ME</p>
                    </div>
                </div>
                    <div class="header-login-container">
                        <button class="header-login-btn" onclick="window.location.href='login.html'">
                            <p> Login </p>
                        </button>
                    </div>

                
            </header>

            <div class="controls-bar">
                <button class="filter-btn">
                    <img src="assets/images/filters-icon.svg" alt="Search Icon" class="nav-search-icon">
                    Filters
                </button>
                <div class="sort-dropdown">
                    <label>Sort by</label>
                    <select>
                        <option>Popular</option>
                        <option>Top Rated</option>
                        <option>Newest</option>
                    </select>
                </div>
            </div>

            <section class="movie-grid" id="movieGrid">
                
                <article class="movie-card">
                    <img src="assets/images/bugonia-movie-poster.svg" alt="Movie Poster" class="poster-img">
                    <div class="rating-badge">
                        7.4 
                        <img src="assets/images/ratings-star.svg" alt="Ratings Star" class="ratings-star-img">
                    </div>
                    
                    <div class="card-overlay">
                        <button class="icon-btn">
                            <img src="assets/images/eye-icon.svg" alt="Ratings Star" class="ratings-star-img">
                        </button>
                        <button class="icon-btn">
                            <img src="assets/images/heart-icon.svg" alt="Ratings Star" class="ratings-star-img">
                        </button>
                        <button class="icon-btn">
                            <img src="assets/images/plus-icon.svg" alt="Ratings Star" class="ratings-star-img">
                        </button>
                        <div class="movie-title-pill">
                            bugonia (2025)
                        </div>
                    </div>
                </article>
