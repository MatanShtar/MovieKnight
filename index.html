<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieKnight | Home</title>
    <meta
      name="description"
      content="MovieKnight — a gamified movie organizer. Browse and filter movies, build collections, and Spin the Wheel to beat 'what should we watch?' paralysis."
    />

    <!-- Open Graph: link preview for WhatsApp / iMessage / Slack / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MovieKnight" />
    <meta property="og:title" content="MovieKnight" />
    <meta
      property="og:description"
      content="Browse and filter movies, build collections, and Spin the Wheel to pick what to watch."
    />
    <meta property="og:url" content="https://movieknight.site/" />
    <meta
      property="og:image"
      content="https://movieknight.site/assets/images/og-image.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://movieknight.site/assets/images/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MovieKnight" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MovieKnight" />
    <meta
      name="twitter:description"
      content="Browse and filter movies, build collections, and Spin the Wheel to pick what to watch."
    />
    <meta
      name="twitter:image"
      content="https://movieknight.site/assets/images/og-image.png"
    />

    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="assets/images/favicon-180.png?v=2" />
    <link rel="stylesheet" href="css/core/common.css" />
    <link rel="stylesheet" href="css/pages/home/layout.css" />
    <link rel="stylesheet" href="css/pages/home/controls.css" />
    <link rel="stylesheet" href="css/pages/home/pills.css" />
    <link rel="stylesheet" href="css/pages/home/cards.css" />
    <link rel="stylesheet" href="css/pages/home/responsive.css" />
    <link rel="stylesheet" href="css/components/collection-modal.css" />
    <link rel="stylesheet" href="vendor/toastify/toastify.min.css" />
    <script src="vendor/toastify/toastify.min.js" defer></script>
    <script src="js/core/toast.js" defer></script>
    <script src="js/core/common.js" defer></script>
    <script src="js/core/api.js" defer></script>
    <script src="js/components/collection-modal.js" defer></script>
    <script src="js/components/library-buttons.js" defer></script>
    <script src="js/pages/home/feed.js" defer></script>
    <script src="js/pages/home/ui.js" defer></script>
    <script src="js/pages/home/filters.js" defer></script>
    <script src="js/pages/home/main.js" defer></script>
  </head>

  <body class="app-body">
    <div class="app-container">
      <header class="mobile-topbar">
        <a class="mobile-brand" href="index.html">
          <img
            class="mobile-brand-knight"
            src="assets/images/knight-minimal-logo.svg"
            alt=""
          />
          <img
            class="mobile-brand-text"
            src="assets/images/movie-knight-wordmark.svg"
            alt="MovieKnight"
          />
        </a>
      </header>

      <aside class="sidebar">
        <a class="sidebar-logo" href="index.html">
          <img
            src="assets/images/movie-knight-logo-sidebar.svg"
            alt="MovieKnight"
            class="nav-logo"
          />
        </a>

        <nav class="main-nav">
          <a href="index.html" class="nav-link active">
            <img
              src="assets/images/icons/home-icon.svg"
              alt="Home Icon"
              class="nav-logo"
            />
            Home
          </a>

          <a href="#" class="nav-link" data-toast="soon:Coming Soon!">
            <img
              src="assets/images/icons/explore-icon.svg"
              alt="Explore Icon"
              class="nav-logo"
            />
            Explore
          </a>
          <a href="profile.html" class="nav-link">
            <img
              src="assets/images/icons/profile-icon.svg"
              alt="Profile Icon"
              class="nav-logo"
            />
            Profile
          </a>
          <div
            class="settings-container"
            id="sidebarSettings"
            style="display: none"
          >
            <a href="#" class="nav-link" id="settingsToggleBtn">
              <svg
                class="nav-logo custom-gear"
                width="42"
                height="42"
                viewBox="0 0 42 42"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M21 30C25.9706 30 30 25.9705 30 21C30 16.0294 25.9706 12 21 12C16.0294 12 12 16.0294 12 21C12 25.9705 16.0294 30 21 30Z"
                  stroke="white"
                  stroke-width="2"
                  stroke-miterlimit="10"
                />
                <path
                  d="M32.2273 37.5584C33.8076 36.4882 35.2079 35.2079 36.3881 33.7676L31.8072 31.6072L36.0581 22.6053L40.639 24.7658C40.9891 22.9354 41.0891 21.045 40.9191 19.1446L36.1481 20.855L32.7874 11.4831L37.5584 9.7727C36.4882 8.19238 35.2079 6.79212 33.7676 5.61188L31.6072 10.1928L22.6053 5.9419L24.7658 1.36101C22.9354 1.01094 21.045 0.910888 19.1446 1.08092L20.915 6.01192L11.5431 9.37266L9.7727 4.44159C8.19238 5.51181 6.7921 6.79211 5.61186 8.23241L10.1928 10.3928L5.94192 19.3947L1.36099 17.2342C1.01091 19.0646 0.910895 20.955 1.08093 22.8554L5.8519 21.145L9.21259 30.5169L4.44162 32.2273C5.51184 33.8076 6.79209 35.2079 8.23239 36.3881L10.3928 31.8072L19.3947 36.0581L17.2342 40.639C19.0646 40.9891 20.955 41.0891 22.8554 40.9191L21.205 36.3082L30.577 32.9474L32.2273 37.5584Z"
                  stroke="white"
                  stroke-width="2"
                  stroke-miterlimit="10"
                />
              </svg>
              Settings
              <span class="settings-arrow"></span>
            </a>
            <div class="settings-submenu" id="settingsSubmenu">
              <a href="#" data-toast="soon:Coming Soon!"
                ><img
                  src="assets/images/icons/preferences-icon.svg"
                  alt="Pref"
                />
                Preferences</a
              >
              <a href="#" data-toast="soon:Coming Soon!"
                ><img
                  src="assets/images/icons/account-icon.svg"
                  alt="Account"
                />
                Account Settings</a
              >
            </div>
          </div>

          <a
            href="about.html"
            class="nav-link about-link"
          >
            <img
              src="assets/images/icons/about-icon.svg"
              alt="Home Icon"
              class="nav-logo"
            />
            <span>About</span>
          </a>
        </nav>
      </aside>

      <main class="main-content">
        <div class="content-head">
          <header class="top-header">
            <div class="header-left-group">
              <button
                class="mobile-nav-toggle"
                id="mobileNavToggle"
                aria-label="Open menu"
                aria-expanded="false"
              >
                <img src="assets/images/icons/hamburger-menu-icon.svg" alt="" />
              </button>
              <div class="search-container">
                <img
                  src="assets/images/icons/search-icon.svg"
                  alt="Search Icon"
                  class="nav-search-icon"
                />
                <input
                  type="text"
                  id="movieSearch"
                  placeholder="Search movies..."
                />
                <button class="ai-mode-btn">
                  <img
                    src="assets/images/icons/ai-icon.svg"
                    alt="Search Icon"
                    class="nav-search-icon"
                  />
                  AI mode
                </button>
              </div>

              <div class="surprise-container">
                <button class="surprise-btn" id="surpriseMeBtn">
                  <div class="dice-wrapper">
                    <img
                      src="assets/images/icons/dice-icon-1.svg"
                      id="diceOne"
                      class="dice-icon"
                      alt="Dice"
                    />
                    <img
                      src="assets/images/icons/dice-icon-2.svg"
                      id="diceTwo"
                      class="dice-icon"
                      alt="Dice"
                    />
                  </div>
                </button>
                <p>SURPRISE ME</p>
              </div>
            </div>
          </header>

          <div class="controls-bar">
            <div class="filter-wrapper">
              <button class="filter-btn" id="filterToggleBtn">
                <img
                  src="assets/images/icons/filters-icon.svg"
                  alt="Filters Icon"
                />
                Filters
              </button>

              <div class="filter-dropdown" id="filterMenu">
                <div class="pill-selector-row">
                  <label class="filter-label">Release Year</label>
                  <div class="year-filter">
                    <label class="year-label">From</label>
                    <div class="year-dropdown-wrapper">
                      <button class="year-custom-btn" id="fromYearBtn">
                        Any
                      </button>
                      <div
                        class="pill-dropdown year-dropdown-menu"
                        id="fromYearMenu"
                      ></div>
                    </div>

                    <label class="year-label till-label">Till</label>
                    <div class="year-dropdown-wrapper">
                      <button class="year-custom-btn" id="tillYearBtn">
                        Any
                      </button>
                      <div
                        class="pill-dropdown year-dropdown-menu"
                        id="tillYearMenu"
                      ></div>
                    </div>
                  </div>
                </div>

                <div class="pill-selector-row" id="movieGenreRow">
                  <label class="filter-label">Genres</label>
                  <div class="pill-list" id="movieGenreList"></div>
                  <div class="pill-add-container">
                    <button class="pill-add-btn" id="addGenreBtn">+</button>
                    <button class="pill-clear-btn" id="clearGenreBtn">
                      Clear
                    </button>
                    <div class="pill-dropdown" id="movieGenreDropdown"></div>
                  </div>
                </div>

                <div class="pill-selector-row" id="ratingRow">
                  <label class="filter-label">Rating</label>
                  <div class="star-rating" id="starRatingContainer">
                    <img
                      class="star"
                      data-value="1"
                      src="assets/images/icons/empty-star-icon.svg"
                      alt="Star 1"
                    />
                    <img
                      class="star"
                      data-value="2"
                      src="assets/images/icons/empty-star-icon.svg"
                      alt="Star 2"
                    />
                    <img
                      class="star"
                      data-value="3"
                      src="assets/images/icons/empty-star-icon.svg"
                      alt="Star 3"
                    />
                    <img
                      class="star"
                      data-value="4"
                      src="assets/images/icons/empty-star-icon.svg"
                      alt="Star 4"
                    />
                    <img
                      class="star"
                      data-value="5"
                      src="assets/images/icons/empty-star-icon.svg"
                      alt="Star 5"
                    />
                    <img
                      class="star"
                      data-value="6"
                      src="assets/images/icons/empty-star-icon.svg"
                      alt="Star 6"
                    />
                    <img
                      class="star"
                      data-value="7"
                      src="assets/images/icons/empty-star-icon.svg"
                      alt="Star 7"
                    />
                    <img
                      class="star"
                      data-value="8"
                      src="assets/images/icons/empty-star-icon.svg"
                      alt="Star 8"
                    />
                    <img
                      class="star"
                      data-value="9"
                      src="assets/images/icons/empty-star-icon.svg"
                      alt="Star 9"
                    />
                    <img
                      class="star"
                      data-value="10"
                      src="assets/images/icons/empty-star-icon.svg"
                      alt="Star 10"
                    />
                  </div>
                </div>

                <div class="pill-selector-row" id="actorRow">
                  <label class="filter-label">Filter By Actor</label>
                  <div class="pill-list" id="actorList"></div>
                  <div class="pill-add-container">
                    <button class="pill-add-btn" id="addActorBtn">+</button>
                    <button class="pill-clear-btn" id="clearActorBtn">
                      Clear
                    </button>
                    <div class="pill-dropdown" id="actorDropdown"></div>
                  </div>
                </div>

                <div class="pill-selector-row" id="directorRow">
                  <label class="filter-label">Filter By Director</label>
                  <div class="pill-list" id="directorList"></div>
                  <div class="pill-add-container">
                    <button class="pill-add-btn" id="addDirectorBtn">+</button>
                    <button class="pill-clear-btn" id="clearDirectorBtn">
                      Clear
                    </button>
                    <div class="pill-dropdown" id="directorDropdown"></div>
                  </div>
                </div>

                <div class="pill-selector-row" id="ageRatingRow">
                  <label class="filter-label">Age Rating</label>
                  <div class="year-dropdown-wrapper">
                    <button class="year-custom-btn" id="ageRatingBtn">
                      Any
                    </button>
                    <div
                      class="pill-dropdown year-dropdown-menu"
                      id="ageRatingMenu"
                    ></div>
                  </div>
                </div>

                <div class="pill-selector-row" id="platformRow">
                  <label class="filter-label">Where To Watch</label>
                  <div class="pill-list" id="platformList"></div>
                  <div class="pill-add-container">
                    <button class="pill-add-btn" id="addPlatformBtn">+</button>
                    <button class="pill-clear-btn" id="clearPlatformBtn">
                      Clear
                    </button>
                    <div class="pill-dropdown" id="platformDropdown"></div>
                  </div>
                </div>

                <div class="filter-actions">
                  <button class="filter-clear-btn" id="filterClearBtn">
                    Clear
                  </button>
                  <button class="filter-apply-btn" id="filterApplyBtn">
                    Apply
                  </button>
                </div>
              </div>
            </div>
            <div class="sort-dropdown" id="sortDropdownContainer">
              <label class="sort-label">Sort by</label>
              <div class="sort-custom-wrapper">
                <button class="sort-custom-btn" id="sortCustomBtn">
                  <span id="sortSelectedText">Popular</span>
                </button>
                <div class="sort-custom-menu" id="sortCustomMenu"></div>
              </div>
            </div>
          </div>
        </div>

        <section class="movie-grid" id="movieGrid">
          <!-- movie cards are injected by js/home/feed.js via js/api.js (live backend) -->
          <!-- Infinite-scroll sentinel: kept as the last grid child; the
               IntersectionObserver in js/home/feed.js watches it and new cards are
               inserted before it. -->
          <div id="infinite-scroll-sentinel" aria-hidden="true"></div>
        </section>
      </main>

      <aside class="user-rail">
        <div class="header-login-container" id="headerAuthContainer">
          <button
            class="header-login-btn"
            id="loginBtn"
            onclick="window.location.href = 'login.html'"
          >
            <p>Login</p>
          </button>

          <div
            class="user-profile-display"
            id="userProfileDisplay"
            style="display: none"
          >
            <div class="user-welcome">
              <span class="welcome-text">Good to see you,</span>
              <span class="username-text" id="displayUsername">User</span>
            </div>

            <button id="headerProfileBtn" class="header-profile-btn">
              <img
                src="assets/images/icons/account-icon.svg"
                alt="Profile"
                class="profile-pic"
              />
            </button>

            <div class="header-dropdown" id="headerDropdown">
              <a href="profile.html">Profile</a>
              <a href="#" data-toast="soon:Coming Soon!">Settings</a>
              <a href="index.html" id="signOutBtn" class="danger-text"
                >Sign Out</a
              >
            </div>
          </div>
        </div>
      </aside>

      <div class="nav-backdrop" id="navBackdrop" hidden></div>
    </div>
  </body>
</html>
