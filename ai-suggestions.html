<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Suggestions - MovieKnight</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="assets/images/favicon-180.png?v=2" />
    <link rel="stylesheet" href="css/core/common.css">
    <link rel="stylesheet" href="vendor/toastify/toastify.min.css">
    <link rel="stylesheet" href="css/components/ai-tryagain.css">
    <link rel="stylesheet" href="css/pages/picker/ai.css">

    <script src="vendor/toastify/toastify.min.js" defer></script>
    <script src="js/core/toast.js" defer></script>
    <script src="js/core/common.js" defer></script>
    <script src="js/core/api.js" defer></script>
    <script src="js/pages/picker/ai.js" defer></script>
</head>

<body class="app-body feature-page">
    <div class="app-container">
        <header class="mobile-topbar">
            <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Open menu" aria-expanded="false">
                <img src="assets/images/icons/hamburger-menu-icon.svg" alt="">
            </button>
            <a class="mobile-brand" href="index.html">
                <img class="mobile-brand-knight" src="assets/images/knight-minimal-logo.svg" alt="">
                <img class="mobile-brand-text" src="assets/images/movie-knight-wordmark.svg" alt="MovieKnight">
            </a>
        </header>

        <aside class="sidebar">
            <a class="sidebar-logo" href="index.html">
                <img src="assets/images/movie-knight-logo-sidebar.svg" alt="MovieKnight" class="nav-logo">
            </a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">
                    <img src="assets/images/icons/home-icon.svg" alt="Home Icon" class="nav-logo"> Home
                </a>
                <a href="coming-soon.html?feature=Explore" class="nav-link">
                    <img src="assets/images/icons/explore-icon.svg" alt="Explore Icon" class="nav-logo"> Explore
                </a>
                <a href="profile.html" class="nav-link">
                    <img src="assets/images/icons/profile-icon.svg" alt="Profile Icon" class="nav-logo"> Profile
                </a>
                <div class="settings-container" id="sidebarSettings" style="display: none">
                    <a href="#" class="nav-link" id="settingsToggleBtn">
                        <img src="assets/images/icons/settings-icon.svg" alt="Settings" class="nav-logo"> Settings
                        <span class="settings-arrow"></span>
                    </a>
                    <div class="settings-submenu" id="settingsSubmenu">
                        <a href="coming-soon.html?feature=Preferences"><img src="assets/images/icons/preferences-icon.svg" alt="Pref"> Preferences</a>
                        <a href="coming-soon.html?feature=Settings"><img src="assets/images/icons/account-icon.svg" alt="Account"> Account Settings</a>
                    </div>
                </div>
                <a href="about.html" class="nav-link about-link">
                    <img src="assets/images/icons/about-icon.svg" alt="About Icon" class="nav-logo">
                    <span>About</span>
                </a>
            </nav>
        </aside>

        <main class="main-content ai-page">
            <div class="ai-header">
                <a href="picker.html?panel=ai" class="back-btn" id="aiBackBtn">Back</a>
                <img src="assets/images/login-logo-text.svg" alt="MovieKnight" class="wheel-main-logo">
            </div>

            <div class="feature-tabs" id="aiHeaderBar">
                <p>LET AI CHOOSE</p>
            </div>

            <section class="ai-stage">
                <div class="ai-results" id="aiResults"></div>

                <button class="ai-tryagain" id="aiTryAgain" type="button">
                    TRY AGAIN
                    <svg class="ai-tryagain-arrows" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-8.49-6"
                              fill="none" stroke="currentColor" stroke-width="2"
                              stroke-linecap="round" stroke-linejoin="round"/>
                        <polyline points="3 21 3 15 9 15"
                                  fill="none" stroke="currentColor" stroke-width="2"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 8.49 6"
                              fill="none" stroke="currentColor" stroke-width="2"
                              stroke-linecap="round" stroke-linejoin="round"/>
                        <polyline points="21 3 21 9 15 9"
                                  fill="none" stroke="currentColor" stroke-width="2"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </section>
        </main>

        <aside class="user-rail">
            <div class="header-login-container" id="headerAuthContainer">
                <button class="header-login-btn" id="loginBtn" onclick="window.location.href = 'login.html'">
                    <p>Login</p>
                </button>
                <div class="user-profile-display" id="userProfileDisplay" style="display: none">
                    <div class="user-welcome">
                        <span class="welcome-text">Good to see you,</span>
                        <span class="username-text" id="displayUsername">User</span>
                    </div>
                    <button id="headerProfileBtn" class="header-profile-btn">
                        <img src="assets/images/icons/account-icon.svg" alt="Profile" class="profile-pic">
                    </button>
                    <div class="header-dropdown" id="headerDropdown">
                        <a href="profile.html">Profile</a>
                        <a href="coming-soon.html?feature=Settings">Settings</a>
                        <a href="index.html" id="signOutBtn" class="danger-text">Sign Out</a>
                    </div>
                </div>
            </div>
        </aside>

        <div class="nav-backdrop" id="navBackdrop" hidden></div>
    </div>

    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <!-- Winner popup — same format as the Spin the Wheel / Chopping Block winner
         screen. The AI flow's action is "View Details" (the pick is already in
         the collection, so there's nothing to add). -->
    <div class="winner-overlay" id="winnerOverlay">
        <div class="winner-box">
            <button class="winner-close" id="winnerClose" aria-label="Close">&#10005;</button>
            <div class="winner-header">WE HAVE A WINNER!</div>
            <div class="winner-title" id="winnerTitle"></div>
            <div class="winner-actions">
                <button class="winner-remove" id="aiViewDetails">View Details</button>
                <a class="winner-remove winner-secondary" id="aiBackToCollection" href="collection.html">Back to Collection</a>
            </div>
        </div>
    </div>
</body>

</html>
