<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieKnight | Profile</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="assets/images/favicon-180.png?v=2" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="vendor/toastify/toastify.min.css" />
    <script src="vendor/toastify/toastify.min.js" defer></script>
    <script src="js/toast.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/profile.js" defer></script>
  </head>

  <body class="app-body">
    <div class="app-container">
      <header class="mobile-topbar">
        <button
          class="mobile-nav-toggle"
          id="mobileNavToggle"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <img src="assets/images/icons/hamburger-menu-icon.svg" alt="" />
        </button>
        <a class="mobile-brand" href="index.html">
          <img
            class="mobile-brand-knight"
            src="assets/images/knight-minimal-logo.svg"
            alt=""
          />
          <img
            class="mobile-brand-text"
            src="assets/images/movie-knight-wordmark.svg"
            alt="MovieKnight"
          />
        </a>
      </header>

      <aside class="sidebar">
        <a class="sidebar-logo" href="index.html">
          <img
            src="assets/images/movie-knight-logo-sidebar.svg"
            alt="MovieKnight"
            class="nav-logo"
          />
        </a>
        <nav class="main-nav">
          <a href="index.html" class="nav-link">
            <img
              src="assets/images/icons/home-icon.svg"
              alt="Home Icon"
              class="nav-logo"
            />
            Home
          </a>

          <a href="#" class="nav-link" data-toast="soon:Coming Soon!">
            <img
              src="assets/images/icons/explore-icon.svg"
              alt="Explore Icon"
              class="nav-logo"
            />
            Explore
          </a>
          <a href="profile.html" class="nav-link active">
            <img
              src="assets/images/icons/profile-icon.svg"
              alt="Profile Icon"
              class="nav-logo"
            />
            Profile
          </a>
          <div class="settings-container" id="sidebarSettings">
            <a href="#" class="nav-link" id="settingsToggleBtn">
              <svg
                class="nav-logo custom-gear"
                width="42"
                height="42"
                viewBox="0 0 42 42"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M21 30C25.9706 30 30 25.9705 30 21C30 16.0294 25.9706 12 21 12C16.0294 12 12 16.0294 12 21C12 25.9705 16.0294 30 21 30Z"
                  stroke="white"
                  stroke-width="2"
                  stroke-miterlimit="10"
                />
                <path
                  d="M32.2273 37.5584C33.8076 36.4882 35.2079 35.2079 36.3881 33.7676L31.8072 31.6072L36.0581 22.6053L40.639 24.7658C40.9891 22.9354 41.0891 21.045 40.9191 19.1446L36.1481 20.855L32.7874 11.4831L37.5584 9.7727C36.4882 8.19238 35.2079 6.79212 33.7676 5.61188L31.6072 10.1928L22.6053 5.9419L24.7658 1.36101C22.9354 1.01094 21.045 0.910888 19.1446 1.08092L20.915 6.01192L11.5431 9.37266L9.7727 4.44159C8.19238 5.51181 6.7921 6.79211 5.61186 8.23241L10.1928 10.3928L5.94192 19.3947L1.36099 17.2342C1.01091 19.0646 0.910895 20.955 1.08093 22.8554L5.8519 21.145L9.21259 30.5169L4.44162 32.2273C5.51184 33.8076 6.79209 35.2079 8.23239 36.3881L10.3928 31.8072L19.3947 36.0581L17.2342 40.639C19.0646 40.9891 20.955 41.0891 22.8554 40.9191L21.205 36.3082L30.577 32.9474L32.2273 37.5584Z"
                  stroke="white"
                  stroke-width="2"
                  stroke-miterlimit="10"
                />
              </svg>
              Settings
              <span class="settings-arrow"></span>
            </a>
            <div class="settings-submenu" id="settingsSubmenu">
              <a href="#" data-toast="soon:Coming Soon!"
                ><img
                  src="assets/images/icons/preferences-icon.svg"
                  alt="Pref"
                />
                Preferences</a
              >
              <a href="#" data-toast="soon:Coming Soon!"
                ><img
                  src="assets/images/icons/account-icon.svg"
                  alt="Account"
                />
                Account Settings</a
              >
            </div>
          </div>

          <a
            href="about.html"
            class="nav-link about-link"
          >
            <img
              src="assets/images/icons/about-icon.svg"
              alt="Home Icon"
              class="nav-logo"
            />
            <span>About</span>
          </a>
        </nav>
      </aside>
      <main class="main-content profile-main">
        <section class="profile-header">
          <div class="profile-info">
            <div class="profile-info-left-col">
              <div class="profile-avatar-container">
                <div class="profile-avatar">
                  <img
                    src="assets/images/default-avatar.svg"
                    alt="Profile picture"
                    class="avatar-pic"
                  />
                  <img
                    src="assets/images/icons/upload-profile-pic-icon.svg"
                    alt="Change profile picture"
                    class="upload-new-pic"
                  />
                </div>
              </div>
              <div class="profile-meta">
                <!-- injected dynamically based on real collections amount -->
                <p id="collectionCount" aria-live="polite"></p>
                <button
                  class="new-collection-btn"
                >
                  <img
                    src="assets/images/icons/plus-icon.svg"
                    alt="Plus icon"
                  />
                  <span>New Collection</span>
                </button>
              </div>
            </div>

            <div class="profile-info-right-col">
              <h2 class="profile-username"></h2>
              <div class="bio-edit">
                <p class="profile-bio profile-bio--placeholder">Add bio</p>
                <button
                  class="bio-edit-btn"
                  aria-label="Edit bio"
                >
                  <img
                    src="assets/images/icons/rename-icon.svg"
                    alt="Edit bio"
                  />
                </button>
              </div>
            </div>
          </div>

          <div class="profile-badges">
            <h2 class="prog-badges-header">Progression Badges</h2>
            <!-- shield metal gradients, referenced by the JS-rendered shields in js/profile.js -->
            <svg width="0" height="0" class="badge-gradient-defs" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="silver-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#DED9D6" /><stop offset="6%" stop-color="#CFCAC8" /><stop offset="18%" stop-color="#A8A4A6" /><stop offset="26%" stop-color="#8B878D" /><stop offset="52%" stop-color="#F3F4F4" /><stop offset="58%" stop-color="#E4E5E5" /><stop offset="70%" stop-color="#BFBEC0" /><stop offset="86%" stop-color="#847F84" /><stop offset="88%" stop-color="#807B80" /><stop offset="100%" stop-color="#A7A9AC" />
                </linearGradient>
                <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FBC926" /><stop offset="25%" stop-color="#FFFBCC" /><stop offset="30%" stop-color="#F8EFBA" /><stop offset="41%" stop-color="#E7D18D" /><stop offset="55%" stop-color="#CCA246" /><stop offset="60%" stop-color="#C3922E" /><stop offset="87%" stop-color="#EED688" /><stop offset="100%" stop-color="#FFFBCC" />
                </linearGradient>
                <linearGradient id="bronze-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#541513" /><stop offset="21%" stop-color="#8D5027" /><stop offset="45%" stop-color="#CB9552" /><stop offset="56%" stop-color="#FFF2DB" /><stop offset="70%" stop-color="#D7B189" /><stop offset="84%" stop-color="#AB6B2D" /><stop offset="89%" stop-color="#9C530D" /><stop offset="100%" stop-color="#9C530D" />
                </linearGradient>
              </defs>
            </svg>
            <!-- shields rendered from the current user's badges (js/profile.js) -->
            <div class="badges-display" id="badgesDisplay"></div>
            <div class="view-badges-container">
              <button class="view-badges-btn" data-toast="soon:Coming Soon!">
                View All Badges
              </button>
            </div>
          </div>
        </section>

        <section class="collections-row">
          <!-- collection cards will be injected by js here -->
        </section>
      </main>

      <aside class="user-rail">
        <div class="header-login-container" id="headerAuthContainer">
          <button
            class="header-login-btn"
            id="loginBtn"
            onclick="window.location.href = 'login.html'"
          >
            <p>Login</p>
          </button>

          <div
            class="user-profile-display"
            id="userProfileDisplay"
            style="display: none"
          >
            <div class="user-welcome">
              <span class="welcome-text">Good to see you,</span>
              <span class="username-text" id="displayUsername"></span>
            </div>

            <button id="headerProfileBtn" class="header-profile-btn">
              <img
                src="assets/images/default-avatar.svg"
                alt="Profile"
                class="profile-pic"
              />
            </button>

            <div class="header-dropdown" id="headerDropdown">
              <a href="profile.html">Profile</a>
              <a href="#" data-toast="soon:Coming Soon!">Settings</a>
              <a href="index.html" id="signOutBtn" class="danger-text"
                >Sign Out</a
              >
            </div>
          </div>
        </div>
      </aside>

      <div class="nav-backdrop" id="navBackdrop" hidden></div>
    </div>

    <!-- Shared popup menu for the collection cards' 3-dots button.
    items are built in js/profile.js (renderMenu) per collection -->
    <div class="collection-menu" id="collectionMenu" hidden></div>
  </body>
</html>
