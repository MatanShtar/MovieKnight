<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin The Wheel - MovieKnight</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="vendor/toastify/toastify.min.css">
    <link rel="stylesheet" href="css/wheel.css">

    <script src="vendor/toastify/toastify.min.js" defer></script>
    <script src="js/toast.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/wheel.js" defer></script>
</head>

<body class="app-body">
    <div class="app-container">
        <main class="main-content wheel-page">
            <div class="wheel-header">
                <a href="picker.html" class="back-btn">Back</a>
                <img src="assets/images/login-logo-text.svg" alt="MovieKnight" class="wheel-main-logo">
            </div>

            <div class="feature-tabs" id="pickerTabs">
                <p>SPIN THE WHEEL</p>
            </div>

            <section class="wheel-stage">
                <div class="wheel-zone">
                    <div class="wheel-visual-container">
                        <div class="wheel-pointer"></div>
                        <canvas id="rouletteWheel" width="584" height="584"></canvas>
                        <button class="spin-btn" id="spinBtn">SPIN</button>
                    </div>
                </div>

                <div class="wheel-panel">
                    <div class="movie-list-box">
                        <div class="movie-list" id="wheelMovieList"></div>
                    </div>

                    <div class="wheel-save-controls">
                        <button class="save-btn load-btn">Load Latest Wheel</button>
                        <button class="save-btn save-current-btn">Save Current Wheel</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <div class="winner-overlay" id="winnerOverlay">
        <div class="winner-box">
            <button class="winner-close" id="winnerClose" aria-label="Close">&#10005;</button>
            <div class="winner-header">WE HAVE A WINNER!</div>
            <div class="winner-title" id="winnerTitle"></div>
            <button class="winner-remove" id="winnerRemove">Remove from the Wheel</button>
        </div>
    </div>
<script>window.addEventListener('load',()=>{showWinner(6);});</script>
</body>

</html>
