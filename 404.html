<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieKnight | Not Found</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="assets/images/favicon-180.png?v=2" />
    <link rel="stylesheet" href="css/core/common.css" />
    <link rel="stylesheet" href="css/core/error.css" />

    <script src="js/pages/404/quotes.js" defer></script>
  </head>

  <body class="app-body error-body">
    <main class="error-page">
      <!-- Glitchy "404" — the same digits are stacked three times so the red/cyan
           chromatic-aberration clones can jitter independently. data-text feeds the
           pseudo-element clones their content. -->
      <h1 class="error-code glitch" data-text="404" aria-label="404">404</h1>

      <!-- Filled in with a random movie-flavoured one-liner by the script below.
           The default copy here is the no-JS fallback. -->
      <p class="error-message" id="errorQuote">
        NOT FOUND
      </p>

      <a class="error-home-btn" href="index.html">
        <span class="error-home-arrow" aria-hidden="true">&larr;</span> Back to Home Page
      </a>
    </main>
  </body>
</html>
