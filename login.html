<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MovieKnight</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    
    <div class="login-wrapper">
        <div class="logo-container">
            <img src="assets/login-logo-text.svg" alt="MovieKnight Logo" class="main-logo" >
        </div>

        <form class="login-box" id="loginForm">
            <h2>LOGIN</h2>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Email or Username" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            
            <button type="submit" class="submit-btn">LOGIN</button>
            
            <div class="form-links">
                <p>not a member? SIGN UP <a href="#">here</a></p>
                <p>or continue as a <a href="index.html">guest</a></p>
            </div>
        </form>
    </div>

    <script src="js/validation.js"></script>
</body>
</html>
