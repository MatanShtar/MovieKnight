<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieKnight | Sign Up</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="assets/images/favicon-180.png?v=2" />
    <link rel="stylesheet" href="css/core/common.css" />
    <link rel="stylesheet" href="css/pages/auth/auth.css" />
    <link rel="stylesheet" href="vendor/toastify/toastify.min.css" />
    <script src="vendor/toastify/toastify.min.js" defer></script>
    <script src="js/core/toast.js" defer></script>
    <script src="js/core/api.js" defer></script>
    <script src="js/pages/auth/validation.js" defer></script>
  </head>
  <body class="signup-body">
    <div class="signup-wrapper">
      <div class="logo-container">
        <img
          src="assets/images/login-logo-text.svg"
          alt="MovieKnight Logo"
          class="main-logo"
        />
      </div>

      <form class="signup-box" id="signupForm" autocomplete="off" novalidate>
        <h2>SIGN UP</h2>

        <div class="input-group">
          <input type="text" id="signupName" placeholder="Full Name" required />
        </div>

        <div class="input-group">
          <input
            type="date"
            id="signupDob"
            placeholder="DD / MM / YYYY"
            required
          />
        </div>

        <div class="input-group">
          <input type="email" id="signupEmail" placeholder="Email" required />
        </div>

        <div class="input-group">
          <input
            type="text"
            id="signupUsername"
            placeholder="Username"
            required
          />
        </div>

        <div class="input-group">
          <input
            type="password"
            id="signupPassword"
            placeholder="Password"
            required
          />
        </div>

        <div class="input-group">
          <input
            type="password"
            id="signupConfirmPassword"
            placeholder="Confirm Password"
            required
          />
        </div>

        <div id="signupErrorMsg" class="error-message"></div>

        <button type="submit" class="submit-btn">SIGN UP</button>

        <div class="form-links">
          <p>already a member? LOGIN <a href="login.html">here</a></p>
          <p>
            or continue as a
            <a href="#" onclick="continueAsGuest(event)">guest</a>
          </p>
        </div>
      </form>
    </div>
  </body>
</html>
