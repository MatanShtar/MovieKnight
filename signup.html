!<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp - MovieKnight</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="signup-body">
    
    <div class="signup-wrapper">
        <div class="logo-container">
            <img src="assets/images/login-logo-text.svg" alt="MovieKnight Logo" class="main-logo" >
        </div>

        <form class="signup-box" id="loginForm">
            <h2>SIGN UP</h2>
            
            <div class="input-group">
                <input type="text" id="name" placeholder="Full Name" required>
            </div>

            <div class="input-group">
                <input type="date" id="dob" placeholder="DD/MM/YYYY" required>
            </div>

            <div class="input-group">
                <input type="text" id="email" placeholder="Email" required>
            </div>

            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="input-group">
                <input type="password" id="confirm-password" placeholder="Confirm Password" required>
            </div>
            
            <button type="submit" class="submit-btn">SIGN UP</button>
            
            <div class="form-links">
                <p>already a member? LOGIN <a href="login.html">here</a></p>
                <p>or continue as a <a href="index.html">guest</a></p>
            </div>
        </form>
    </div>

    <script src="js/validation.js"></script>
</body>
</html>
